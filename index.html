<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="60초 안에 같은 그림 8쌍을 찾는 4x4 메모리 게임" />
  <title>같은 그림 맞추기</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #ffffff;
      --cream: #fff4d8;
      --pink: #ffc9da;
      --sky: #ccecff;
      --mint: #d5f2d1;
      --panel: #fffaf0;
      --card-front: #fffdf7;
      --accent: #f38bab;
      --accent-strong: #dc6e92;
      --text: #4b4650;
      --muted: #77707d;
      --danger: #e45f78;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: start center;
      padding: 24px;
      overflow-x: hidden;
      overflow-y: auto;
      font-family: Inter, Pretendard, "Noto Sans KR", system-ui, sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    button { font: inherit; }

    .game-shell {
      width: min(100%, 1060px);
      margin: auto 0;
      text-align: center;
    }

    .game-layout {
      display: grid;
      grid-template-columns: 180px minmax(0, 620px) 210px;
      align-items: start;
      gap: 18px;
    }

    .game-area { min-width: 0; }

    .history-panel {
      padding: 18px 14px;
      border: 1px solid #f0dfca;
      border-radius: 20px;
      background: var(--panel);
      box-shadow: 0 14px 36px rgba(117, 89, 105, 0.1);
      text-align: left;
    }

    .history-panel h2 {
      margin: 0 0 12px;
      font-size: 1rem;
      text-align: center;
    }

    .score-history {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .score-history li {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 9px 10px;
      border-radius: 10px;
      color: #75475a;
      background: #fff0f5;
      font-size: 0.88rem;
      font-weight: 750;
    }

    .empty-history {
      margin: 0;
      color: var(--muted);
      font-size: 0.85rem;
      line-height: 1.55;
      text-align: center;
    }

    .tree-panel {
      padding: 18px 14px;
      border: 1px solid #cfe7cb;
      border-radius: 20px;
      background: #f3fbf1;
      box-shadow: 0 14px 36px rgba(77, 126, 86, 0.1);
    }

    .tree-panel h2 { margin: 0 0 4px; font-size: 1rem; }
    .fruit-count { margin: 0; color: #66806c; font-size: 0.85rem; }

    .tree-scene {
      position: relative;
      min-height: 285px;
      margin-top: 8px;
    }

    .tree {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 8px 8px rgba(74, 117, 79, 0.13));
    }

    .fruit-slots {
      position: absolute;
      inset: 0;
      list-style: none;
      margin: 0;
      padding: 0;
      pointer-events: none;
      z-index: 2;
    }

    .fruit-slots li {
      position: absolute;
      opacity: 0;
      font-size: 1.45rem;
      transform: scale(0.2);
      transition: opacity 320ms ease, transform 420ms cubic-bezier(.2, 1.5, .4, 1);
      filter: drop-shadow(0 3px 2px rgba(79, 55, 39, 0.24));
    }

    .fruit-slots li:nth-child(1) { left: 45%; top: 8%; }
    .fruit-slots li:nth-child(2) { left: 23%; top: 17%; }
    .fruit-slots li:nth-child(3) { right: 20%; top: 20%; }
    .fruit-slots li:nth-child(4) { left: 9%; top: 32%; }
    .fruit-slots li:nth-child(5) { left: 39%; top: 31%; }
    .fruit-slots li:nth-child(6) { right: 7%; top: 34%; }
    .fruit-slots li:nth-child(7) { left: 20%; top: 45%; }
    .fruit-slots li:nth-child(8) { right: 25%; top: 47%; }
    .fruit-slots li:nth-child(9) { left: 38%; top: 54%; }
    .fruit-slots li:nth-child(10) { right: 10%; top: 56%; }

    .fruit-slots li.grown { opacity: 1; transform: scale(1); }

    .tree-feast-animals {
      position: absolute;
      inset: -18px;
      z-index: 5;
      pointer-events: none;
    }

    .tree-feast-animals span {
      position: absolute;
      opacity: 0;
      font-size: 2.2rem;
      filter: drop-shadow(0 4px 3px rgba(65, 52, 44, 0.22));
    }

    .tree-feast-animals span:nth-child(1) { left: 7%; top: 35%; --start-x: -150px; --start-y: 80px; }
    .tree-feast-animals span:nth-child(2) { right: 8%; top: 40%; --start-x: 150px; --start-y: 80px; }
    .tree-feast-animals span:nth-child(3) { left: 26%; top: 58%; --start-x: -110px; --start-y: 120px; }
    .tree-feast-animals span:nth-child(4) { right: 23%; top: 59%; --start-x: 110px; --start-y: 120px; }

    .tree-feast-animals.active span {
      animation: animal-gather 3.1s cubic-bezier(.2,.75,.25,1) forwards;
    }

    .tree-feast-animals.active span:nth-child(2) { animation-delay: .18s; }
    .tree-feast-animals.active span:nth-child(3) { animation-delay: .34s; }
    .tree-feast-animals.active span:nth-child(4) { animation-delay: .5s; }

    @keyframes animal-gather {
      0% { opacity: 0; transform: translate(var(--start-x), var(--start-y)) scale(.45); }
      28% { opacity: 1; transform: translate(0, 0) scale(1); }
      42%, 66%, 90% { opacity: 1; transform: translateY(-8px) rotate(-5deg); }
      54%, 78%, 100% { opacity: 1; transform: translateY(0) rotate(5deg); }
    }

    .celebration {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 22px;
      background: rgba(255, 255, 255, 0.86);
      backdrop-filter: blur(8px);
    }

    .celebration[hidden] { display: none; }

    .celebration-card {
      width: min(100%, 480px);
      overflow: hidden;
      border: 2px solid #ffd0df;
      border-radius: 28px;
      background: #fffaf0;
      box-shadow: 0 28px 70px rgba(112, 76, 95, 0.22);
      text-align: center;
    }

    .celebration-video {
      position: relative;
      display: grid;
      height: 230px;
      place-items: center;
      overflow: hidden;
      background: linear-gradient(160deg, var(--sky), var(--pink) 55%, var(--cream));
    }

    .celebration-hero { z-index: 2; font-size: 6rem; animation: hero-bounce 1.1s ease-in-out infinite; }
    .celebration-hero.forest-party { font-size: clamp(2.6rem, 10vw, 4.2rem); letter-spacing: .08em; }
    .feast-fruits {
      position: absolute;
      bottom: 22px;
      z-index: 3;
      min-width: 220px;
      font-size: 2rem;
      letter-spacing: .12em;
      transition: transform 220ms ease, opacity 220ms ease;
    }
    .feast-fruits[hidden] { display: none; }
    .sparkle { position: absolute; font-size: 1.7rem; animation: sparkle-float 2.4s ease-in-out infinite; }
    .sparkle:nth-child(2) { left: 12%; top: 16%; }
    .sparkle:nth-child(3) { right: 13%; top: 22%; animation-delay: .4s; }
    .sparkle:nth-child(4) { left: 20%; bottom: 18%; animation-delay: .8s; }
    .sparkle:nth-child(5) { right: 18%; bottom: 14%; animation-delay: 1.2s; }
    .celebration-copy { padding: 24px; }
    .celebration-copy h2 { margin: 0 0 8px; font-size: 1.7rem; }
    .celebration-copy p { margin: 0 0 18px; color: var(--muted); }

    .fairy-guide {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 4px;
      pointer-events: none;
      will-change: transform;
      filter: drop-shadow(0 5px 5px rgba(98, 61, 103, 0.2));
    }

    .fairy-guide[hidden] { display: none; }

    .fairy-character {
      display: inline-block;
      width: clamp(64px, 8vw, 86px);
      height: auto;
      animation: fairy-flutter 480ms ease-in-out infinite alternate;
    }

    .fairy-guide.perched {
      position: absolute;
      left: 48%;
      top: 9%;
      z-index: 4;
      transform: translateX(-50%) scale(.7);
      transform-origin: center bottom;
    }

    .fairy-guide.perched .fairy-bubble { display: none; }

    .fairy-sparkle {
      position: absolute;
      left: -10px;
      top: -10px;
      font-size: 1.1rem;
      animation: fairy-twinkle 700ms ease-in-out infinite alternate;
    }

    .fairy-bubble {
      max-width: 110px;
      padding: 6px 9px;
      border: 2px solid #efb8d1;
      border-radius: 14px 14px 14px 4px;
      color: #75475a;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 4px 12px rgba(100, 72, 87, 0.12);
      font-size: 0.78rem;
      font-weight: 800;
      white-space: nowrap;
    }

    @keyframes hero-bounce { 50% { transform: translateY(-12px) scale(1.08) rotate(3deg); } }
    @keyframes sparkle-float { 50% { transform: translateY(-14px) rotate(18deg) scale(1.2); } }
    @keyframes fairy-flutter { to { transform: translateY(-5px) rotate(5deg); } }
    @keyframes fairy-twinkle { to { opacity: 0.35; transform: scale(0.65) rotate(30deg); } }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent-strong);
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 24px;
      font-size: clamp(1.8rem, 6vw, 2.75rem);
      line-height: 1.1;
      letter-spacing: -0.04em;
    }

    .status-bar {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding: 10px;
      border: 1px solid #f0dfca;
      border-radius: 18px;
      background: var(--panel);
      box-shadow: 0 14px 36px rgba(117, 89, 105, 0.12);
    }

    .stat {
      display: flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 650;
      white-space: nowrap;
    }

    .stat strong { color: var(--text); font-size: 1.05rem; }
    .stat.urgent strong { color: var(--danger); }

    .best-record-row {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 34px;
      padding-top: 2px;
      border-top: 1px dashed #ecd8c2;
      color: #765564;
      font-size: 0.9rem;
      font-weight: 750;
    }

    .best-record-row strong { color: #d66b8d; font-size: 1rem; }

    .reset-record-button {
      padding: 5px 9px;
      border: 1px solid #e6ccd5;
      border-radius: 8px;
      color: #76636b;
      background: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
    }

    .reset-record-button:hover { background: #fff0f5; }
    .reset-record-button:focus-visible { outline: 3px solid #659fc1; outline-offset: 2px; }

    .primary-button {
      min-height: 48px;
      padding: 0 21px;
      border: 0;
      border-radius: 12px;
      color: #51313e;
      background: var(--pink);
      box-shadow: 0 8px 22px rgba(243, 139, 171, 0.2);
      font-weight: 850;
      cursor: pointer;
      transition: transform 160ms ease, background 160ms ease, box-shadow 160ms ease;
    }

    .primary-button:hover { background: #ffb8d0; transform: translateY(-1px); }
    .primary-button:active { transform: translateY(1px); }
    .primary-button:disabled { opacity: 0.48; cursor: not-allowed; transform: none; box-shadow: none; }
    .primary-button:focus-visible, .card:focus-visible { outline: 3px solid #659fc1; outline-offset: 3px; }

    .board-wrap {
      padding: clamp(12px, 3vw, 20px);
      border: 1px solid #f0dfca;
      border-radius: 26px;
      background: var(--panel);
      box-shadow: 0 24px 55px rgba(117, 89, 105, 0.13);
    }

    .board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: clamp(8px, 2vw, 14px);
    }

    .card {
      position: relative;
      display: block;
      width: 100%;
      min-width: 0;
      aspect-ratio: 1;
      padding: 0;
      border: 0;
      border-radius: clamp(12px, 2.8vw, 18px);
      background: transparent;
      cursor: pointer;
      perspective: 850px;
    }

    /* aspect-ratio를 지원하지 않는 구형 스마트폰용 정사각형 높이 */
    .card::after {
      content: "";
      display: block;
      padding-bottom: 100%;
    }

    @supports (aspect-ratio: 1) {
      .card::after { display: none; }
    }

    .card:disabled { cursor: default; }

    .card-inner {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      transition: transform 430ms cubic-bezier(.2,.72,.25,1);
    }

    .card.flipped .card-inner,
    .card.matched .card-inner { transform: rotateY(180deg); }

    .card-face {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      border-radius: inherit;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .card-back {
      overflow: hidden;
      border: 1px solid rgba(115, 94, 104, 0.1);
      background: var(--pink);
      box-shadow: 0 7px 16px rgba(117, 89, 105, 0.14);
    }

    .back-hint {
      display: grid;
      width: 56%;
      aspect-ratio: 1;
      place-items: center;
      border: 3px solid rgba(255, 255, 255, 0.88);
      border-radius: 50%;
      color: rgba(112, 87, 101, 0.72);
      background: rgba(255, 255, 255, 0.38);
      box-shadow: 0 5px 14px rgba(108, 78, 94, 0.1);
      font-size: clamp(1.25rem, 5vw, 2.5rem);
      line-height: 1;
      transform: rotate(-8deg);
    }

    .card:nth-child(4n + 2) .card-back { background: var(--sky); }
    .card:nth-child(4n + 3) .card-back { background: var(--mint); }
    .card:nth-child(4n + 4) .card-back { background: var(--cream); }
    .card:not(:disabled):hover .card-back { border-color: rgba(96, 147, 176, 0.5); }

    .card-front {
      border: 3px solid transparent;
      color: var(--text);
      background: var(--card-front);
      box-shadow: 0 9px 22px rgba(117, 89, 105, 0.16);
      font-size: clamp(2rem, 9vw, 4rem);
      line-height: 1;
      transform: rotateY(180deg);
    }

    .card.matched .card-front {
      border-color: #8bcf9b;
      animation: matched-pop 420ms ease;
    }

    .hint {
      min-height: 24px;
      margin: 15px 0 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .theme-badge {
      display: inline-block;
      margin: 14px 0 0;
      padding: 7px 13px;
      border-radius: 999px;
      color: #526f61;
      background: var(--mint);
      font-size: 0.86rem;
      font-weight: 750;
    }

    @keyframes matched-pop {
      50% { transform: rotateY(180deg) scale(1.08); }
    }

    @media (max-width: 980px) {
      body { padding: 16px; }
      h1 { margin-bottom: 18px; }
      .game-layout { grid-template-columns: 170px minmax(0, 1fr); }
      .tree-panel { grid-column: 1 / -1; }
      .tree-scene { width: 210px; min-height: 285px; margin-inline: auto; }
    }

    @media (max-width: 700px) {
      body {
        display: block;
        min-height: 100svh;
        padding: 14px 12px 36px;
      }
      .game-shell { width: 100%; margin: 0 auto; }
      .game-layout { grid-template-columns: 1fr; }
      .game-area { order: 1; width: 100%; }
      .history-panel { order: 2; }
      .tree-panel { order: 3; grid-column: auto; }
      .score-history { grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); }
    }

    @media (max-width: 520px) {
      .eyebrow { margin-bottom: 5px; }
      h1 { margin-bottom: 14px; font-size: 1.85rem; }
      .status-bar { grid-template-columns: 1fr 1fr; }
      .primary-button { grid-column: 1 / -1; }
      .status-bar .primary-button { width: 100%; }
      .board-wrap { padding: 10px; border-radius: 20px; }
      .board { gap: 7px; }
      .card { min-width: 0; border-radius: 11px; }
      .card-front { font-size: clamp(1.7rem, 11vw, 3rem); }
      .back-hint { font-size: clamp(1.15rem, 8vw, 2rem); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main class="game-shell">
    <p class="eyebrow">Memory Match</p>
    <h1>같은 그림 맞추기</h1>

    <div class="game-layout">
      <aside class="history-panel" aria-labelledby="historyTitle">
        <h2 id="historyTitle">점수 기록</h2>
        <p class="empty-history" id="emptyHistory">게임을 마치면<br />점수가 기록돼요.</p>
        <ol class="score-history" id="scoreHistory"></ol>
      </aside>

      <div class="game-area">
        <section class="status-bar" aria-label="게임 상태">
          <div class="stat">현재 점수: <strong id="score">0점</strong></div>
          <div class="stat" id="timerStat">남은 시간: <strong id="time">60초</strong></div>
          <button class="primary-button" id="startButton" type="button">시작하기</button>
          <div class="best-record-row">
            <span>🏆 최고 기록: <strong id="bestScore">0점</strong></span>
            <button class="reset-record-button" id="resetBestScore" type="button">최고기록 초기화</button>
          </div>
        </section>

        <section class="board-wrap">
          <div class="board" id="board" aria-label="4x4 카드 게임판"></div>
        </section>
        <div class="theme-badge" id="themeBadge">시작할 때 그림이 정해져요</div>
        <p class="hint" id="hint" aria-live="polite">시작하기를 누르면 새로운 그림이 나타납니다.</p>
      </div>

      <aside class="tree-panel" aria-labelledby="treeTitle">
        <h2 id="treeTitle">기억 나무</h2>

    let score = 0;
    let timeLeft = 60;
    let matchedPairs = 0;
    let firstCard = null;
    let secondCard = null;
    let isChecking = false;
    let gameActive = false;
    let timerId = null;
    let mismatchTimeout = null;
    let setIndex = -1;
    let currentSet = pictureSets[0];
    let gameCount = 0;
    let fairyMotion = null;
    let fairyRunId = 0;
    let feastTimers = [];
    let feastPending = false;

    function loadBestScore() {
      try { return Math.max(0, Number(localStorage.getItem('memoryBestScore')) || 0); }
      catch { return 0; }
    }

    function saveBestScore() {
      try { localStorage.setItem('memoryBestScore', bestScore); }
      catch { /* 저장소가 제한되어도 현재 게임은 계속됩니다. */ }
    }

    let bestScore = loadBestScore();

    function updateBestScoreDisplay() {
      bestScoreEl.textContent = `${bestScore}점`;
    }
    function loadFruitCount() {
      try { return Math.min(10, Number(localStorage.getItem('memoryFruitCount')) || 0); }
      catch { return 0; }
    }

    function saveFruitCount() {
      try { localStorage.setItem('memoryFruitCount', fruitCount); }
      catch { /* 파일을 직접 실행해 저장소가 제한되어도 게임은 계속됩니다. */ }
    }

    function loadTreeStage() {
      try { return (Number(localStorage.getItem('memoryTreeStage')) || 0) % treeImages.length; }
      catch { return 0; }
    }

    function saveTreeStage() {
      try { localStorage.setItem('memoryTreeStage', treeStage); }
      catch { /* 저장소가 제한되어도 현재 게임은 계속됩니다. */ }
    }

    let fruitCount = loadFruitCount();
    let treeStage = loadTreeStage();
    memoryTree.src = treeImages[treeStage];

    const shuffle = (items) => {
      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    };

    function createBoard(deck = shuffle([...currentSet.items, ...currentSet.items])) {
      board.replaceChildren();
      deck.forEach((picture, index) => {
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'card';
        card.dataset.picture = picture;
        card.setAttribute('aria-label', `${index + 1}번 뒤집힌 카드`);
        card.disabled = !gameActive;
        card.innerHTML = `
          <span class="card-inner">
            <span class="card-face card-back" aria-hidden="true"><span class="back-hint">${currentSet.hint}</span></span>
            <span class="card-face card-front" aria-hidden="true">${picture}</span>
          </span>`;
        card.addEventListener('click', () => flipCard(card));
        board.appendChild(card);
      });
    }

    function updateStatus() {
      scoreEl.textContent = `${score}점`;
      timeEl.textContent = `${timeLeft}초`;
      timerStat.classList.toggle('urgent', timeLeft <= 10 && gameActive);
    }

    function pointNear(element, xRatio, yRatio) {
      const rect = element.getBoundingClientRect();
      return {
        x: Math.max(8, Math.min(window.innerWidth - 130, rect.left + rect.width * xRatio)),
        y: Math.max(8, Math.min(window.innerHeight - 70, rect.top + rect.height * yRatio))
      };
    }

    function startFairyFlight() {
      fairyRunId += 1;
      if (fairyMotion) fairyMotion.cancel();
      if (fairyGuide.parentElement !== document.body) document.body.appendChild(fairyGuide);
      fairyGuide.classList.remove('perched');
      fairyGuide.style.cssText = '';
      fairyGuide.hidden = false;
      fairyBubble.textContent = '같이 찾아봐요!';
      const spots = [
        pointNear(board, 0.02, 0.08),
        pointNear(board, 0.76, 0.02),
        pointNear(board, 0.62, 0.78),
        pointNear(board, 0.04, 0.67),
        pointNear(board, 0.42, 0.33)
      ];
      fairyMotion = fairyGuide.animate(
        spots.map((spot) => ({ transform: `translate(${spot.x}px, ${spot.y}px)` })),
        { duration: 7600, iterations: Infinity, easing: 'ease-in-out' }
      );
    }

    function celebrateAndFlyHome(cleared) {
      const runId = ++fairyRunId;
      if (fairyMotion) fairyMotion.cancel();
      fairyGuide.hidden = false;
      fairyBubble.textContent = cleared ? '우와! 최고예요!' : '정말 잘했어요!';
      const cheerSpot = pointNear(board, 0.42, 0.36);
      const treeRect = treeScene.getBoundingClientRect();
      const treeSpot = { x: treeRect.left + treeRect.width * 0.42, y: treeRect.top + treeRect.height * 0.1 };
      fairyMotion = fairyGuide.animate([
        { transform: `translate(${cheerSpot.x}px, ${cheerSpot.y}px) scale(1) rotate(0deg)`, offset: 0 },
        { transform: `translate(${cheerSpot.x}px, ${cheerSpot.y - 25}px) scale(1.3) rotate(-12deg)`, offset: 0.2 },
        { transform: `translate(${cheerSpot.x + 20}px, ${cheerSpot.y}px) scale(1.1) rotate(12deg)`, offset: 0.4 },
        { transform: `translate(${treeSpot.x}px, ${treeSpot.y}px) scale(.85) rotate(0deg)`, offset: 1 }
      ], { duration: 3200, easing: 'cubic-bezier(.3,.7,.2,1)', fill: 'forwards' });
      fairyMotion.finished.then(() => {
        if (runId !== fairyRunId) return;
        fairyMotion.cancel();
        treeScene.appendChild(fairyGuide);
        fairyGuide.removeAttribute('style');
        fairyGuide.classList.add('perched');
        fairyBubble.textContent = '나무에서 쉴게요!';
      }).catch(() => {});
    }

    function startGame() {
      clearInterval(timerId);
      clearTimeout(mismatchTimeout);
      score = 0;
      timeLeft = 60;
      matchedPairs = 0;
      firstCard = null;
      secondCard = null;
      isChecking = false;
      gameActive = true;
      setIndex = (setIndex + 1) % pictureSets.length;
      currentSet = pictureSets[setIndex];
      startButton.disabled = true;
      startButton.textContent = '게임 중';
      themeBadge.textContent = `이번 그림: ${currentSet.name}`;
      hint.textContent = '같은 그림 두 장을 찾아보세요!';
      updateStatus();
      createBoard();
      startFairyFlight();

      timerId = setInterval(() => {
        timeLeft -= 1;
        updateStatus();
        if (timeLeft <= 0) endGame(false);
      }, 1000);
    }

    function flipCard(card) {
      if (!gameActive || isChecking || card === firstCard || card.classList.contains('matched')) return;

      card.classList.add('flipped');
      card.setAttribute('aria-label', `${card.dataset.picture} 카드, 열림`);

      if (!firstCard) {
        firstCard = card;
        return;
      }

      secondCard = card;
      isChecking = true;

      if (firstCard.dataset.picture === secondCard.dataset.picture) {
        firstCard.classList.add('matched');
        secondCard.classList.add('matched');
        firstCard.disabled = true;
        secondCard.disabled = true;
        score += 10;
        matchedPairs += 1;
        updateStatus();
        resetTurn();
        hint.textContent = '짝을 찾았어요! +10점';
        if (matchedPairs === currentSet.items.length) endGame(true);
      } else {
        hint.textContent = '다른 그림이에요. 다시 기억해 보세요.';
        mismatchTimeout = setTimeout(() => {
          [firstCard, secondCard].forEach((openCard) => {
            openCard.classList.remove('flipped');
            openCard.setAttribute('aria-label', '뒤집힌 카드');
          });
          resetTurn();
        }, 800);
      }
    }

    function resetTurn() {
      firstCard = null;
      secondCard = null;
      isChecking = false;
    }

    function renderTree() {
      fruitSlots.replaceChildren();
      for (let i = 0; i < 10; i += 1) {
        const fruit = document.createElement('li');
        fruit.textContent = ['🍎', '🍊', '🍐', '🍑', '🍒'][i % 5];
        if (i < fruitCount) fruit.classList.add('grown');
        fruitSlots.appendChild(fruit);
      }
      fruitCountEl.textContent = fruitCount;
    }

    function finishForestFeast() {
      if (!feastPending) return;
      feastPending = false;
      feastTimers.forEach(clearTimeout);
      feastTimers = [];
      fruitCount = 0;
      treeStage = (treeStage + 1) % treeImages.length;
      memoryTree.src = treeImages[treeStage];
      saveFruitCount();
      saveTreeStage();
      renderTree();
      treeFeastAnimals.classList.remove('active');
      document.getElementById('treeTitle').textContent = '새로운 기억 나무';
      startButton.disabled = false;
      showCelebration(true, true);
    }

    function startForestFeast() {
      feastPending = true;
      startButton.disabled = true;
      treeScene.scrollIntoView({ behavior: 'smooth', block: 'center' });
      treeFeastAnimals.classList.remove('active');
      void treeFeastAnimals.offsetWidth;
      treeFeastAnimals.classList.add('active');
      const fruitsOnTree = [...fruitSlots.querySelectorAll('.grown')].reverse();
      const snackIcons = ['🍎', '🍊', '🍐', '🍑', '🍒'];
      fruitsOnTree.forEach((fruit, index) => {
        feastTimers.push(setTimeout(() => fruit.classList.remove('grown'), 700 + index * 220));
      });
      snackIcons.forEach((_, index) => {
        feastTimers.push(setTimeout(() => {
          feastFruits.textContent = snackIcons.slice(index + 1).join(' ');
          feastFruits.style.transform = `scale(${1 - index * 0.08})`;
        }, 900 + index * 430));
      });
      feastTimers.push(setTimeout(finishForestFeast, 3400));
    }

    function showCelebration(isMemoryKing, feastFinished = false) {
      if (isMemoryKing && !feastFinished) {
        startForestFeast();
        return;
      }
      celebrationTitle.textContent = isMemoryKing ? '기억왕 탄생! 숲속 과일 잔치' : '100점을 축하해요!';
      celebrationMessage.textContent = isMemoryKing
        ? '동물 친구들이 모여 과일을 맛있게 나눠 먹어요! 잔치가 끝나면 새 나무에서 다시 시작해요.'
        : '대단해요! 기억 나무에 과일이 하나 열렸어요.';
      celebrationHero.textContent = isMemoryKing ? '🐿️ 🐰 🦊 🐻' : '🎉';
      celebrationHero.classList.toggle('forest-party', isMemoryKing);
      feastFruits.hidden = !isMemoryKing;
      feastFruits.textContent = '🍎 🍊 🍐 🍑 🍒';
      feastFruits.style.transform = '';
      celebration.hidden = false;
      closeCelebration.focus();
    }

    function endGame(cleared) {
      if (!gameActive) return;
      if (cleared) score += 20;
      const recordedScore = score;
      if (recordedScore > bestScore) {
        bestScore = recordedScore;
        saveBestScore();
        updateBestScoreDisplay();
      }
      gameActive = false;
      clearInterval(timerId);
      clearTimeout(mismatchTimeout);
      score = 0;
      timeLeft = 60;
      matchedPairs = 0;
      firstCard = null;
      secondCard = null;
      isChecking = false;
      createBoard([...currentSet.items, ...currentSet.items]);
      updateStatus();
      startButton.disabled = false;
      startButton.textContent = '다시 시작';
      timerStat.classList.remove('urgent');
      gameCount += 1;
      emptyHistory.hidden = true;
      const record = document.createElement('li');
      record.innerHTML = `<span>${gameCount}회차</span><strong>${recordedScore}점</strong>`;
      scoreHistory.prepend(record);
      themeBadge.textContent = `완료한 그림: ${currentSet.name}`;
      hint.textContent = cleared ? '모든 짝을 찾았어요! 다시 도전해 보세요.' : '시간이 끝났어요. 다시 도전해 보세요.';
      celebrateAndFlyHome(cleared);
      if (recordedScore === 100) {
        fruitCount = Math.min(10, fruitCount + 1);
        saveFruitCount();
        renderTree();
        showCelebration(fruitCount === 10);
      } else {
        startButton.focus();
      }
    }

    startButton.addEventListener('click', startGame);
    resetBestScore.addEventListener('click', () => {
      bestScore = 0;
      try { localStorage.removeItem('memoryBestScore'); }
      catch { /* 저장소가 제한되어도 화면 기록은 초기화됩니다. */ }
      updateBestScoreDisplay();
      hint.textContent = '최고 기록을 초기화했어요.';
    });
    closeCelebration.addEventListener('click', () => {
      if (feastPending) finishForestFeast();
      celebration.hidden = true;
      startButton.focus();
    });
    createBoard([...currentSet.items, ...currentSet.items]);
    updateStatus();
    updateBestScoreDisplay();
    renderTree();
  </script>
</body>
</html>
